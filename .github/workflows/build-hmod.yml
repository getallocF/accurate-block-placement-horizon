name: Build Horizon Android Mod (.hmod)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-hmod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain with Wasm targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-horizon-mod CLI
        run: cargo install --locked --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Build .hmod (WebAssembly for Android & Cross-Platform)
        run: cargo horizon-mod build --wasm

      - name: Validate .hmod archive
        run: cargo horizon-mod check target/horizon-mod/accurate_block_placement.hmod

      - name: Upload accurate_block_placement.hmod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accurate_block_placement-android-hmod
          path: target/horizon-mod/accurate_block_placement.hmod
          if-no-files-found: error
